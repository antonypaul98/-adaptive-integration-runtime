name: AIR validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: air_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d air_test" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      AIR_TEST_DATABASE_URL: postgresql://postgres:ephemeral-ci-only@127.0.0.1:5432/air_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Infrastructure guard regressions
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - run: python -m pip install '.[test]'
      - name: Environment diagnostics
        run: python scripts/ci_diagnostics.py
      - name: Verify installed package outside checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -c "from air.postgres import migration_sql;
          from air.observer import ContractObserver;
          from air.change_evidence import detect_and_persist;
          from air.change_intelligence import compare_openapi;
          from air.dependency_impact import analyze_and_persist, WorkflowEdge;
          from air.mapping_extraction import extract_registered_dependencies;
          from air.repair_proposal import create_proposal, decide, authorization;
          assert 'FORCE ROW LEVEL SECURITY' in migration_sql()"
      - run: python -m pytest -ra --junitxml=results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-postgres-${{ matrix.postgres }}
          path: results.xml
